<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay-500); margin-bottom: 14px; }
  .ec {
    display: grid; grid-template-columns: 96px 1fr auto;
    gap: 24px; align-items: center;
    padding: 22px 24px; background: var(--cream-100);
    border: 1px solid rgba(43,31,24,0.08); border-radius: 14px;
    max-width: 620px;
  }
  .date { display:flex; flex-direction:column; align-items:center; gap: 2px; padding: 10px 0; border-right: 1px solid rgba(43,31,24,0.08); }
  .date .d { font-family: var(--font-display); font-style: italic; font-size: 38px; line-height: 1; color: var(--terracotta-500); font-variation-settings:'opsz' 28; }
  .date .m { font-family: var(--font-text); font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--clay-500); }
  .body h3 { font-family: var(--font-display); font-size: 22px; color: var(--clay-800); line-height: 1.2; margin-bottom: 4px; }
  .body .meta { font-family: var(--font-text); font-size: 13px; color: var(--clay-500); }
  .arrow { font-family: var(--font-text); color: var(--terracotta-600); font-size: 22px; }
</style></head>
<body>
  <div class="label">Event card</div>
  <div class="ec">
    <div class="date"><span class="d">02</span><span class="m">Juin</span></div>
    <div class="body">
      <h3>Séminaire de découverte — juin</h3>
      <div class="meta">Lun. · 19h30 → 21h30 · Lausanne · 12 places</div>
    </div>
    <span class="arrow">→</span>
  </div>
</body></html>
