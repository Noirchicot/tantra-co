<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wordmark</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .wm {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 76px;
    color: var(--terracotta-500);
    letter-spacing: -0.01em;
    font-variation-settings: 'opsz' 36;
    line-height: 1;
  }
  .tag {
    margin-top: 14px;
    font-family: var(--font-text);
    font-weight: 600;
    font-size: 11px;
    color: var(--clay-500);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .rule { width: 64px; height: 1px; background: var(--terracotta-500); opacity: .5; margin-top: 10px; }
  .stack { display: flex; flex-direction: column; align-items: flex-start; }
</style>
</head>
<body>
  <div class="stack">
    <div class="wm">Tantra &amp; Co.</div>
    <div class="rule"></div>
    <div class="tag">Séminaires &amp; rencontres</div>
  </div>
</body>
</html>
