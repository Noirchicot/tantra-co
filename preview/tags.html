<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay-500); margin-bottom: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .row .lab { font-size: 11px; color: var(--clay-300); width: 80px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }

  .tag {
    font-family: var(--font-text); font-size: 12px; font-weight: 500;
    padding: 5px 11px; border-radius: 999px; line-height: 1.3;
    letter-spacing: 0.02em;
  }
  .tag.ochre { background: var(--ochre-100); color: var(--ochre-700); }
  .tag.terra { background: var(--terracotta-100); color: var(--terracotta-700); }
  .tag.sand { background: var(--sand-200); color: var(--clay-700); }
  .tag.sage { background: var(--sage-100); color: var(--sage-700); }
  .tag.outline { background: transparent; color: var(--clay-700); border: 1px solid rgba(43,31,24,0.18); }

  .chip {
    font-family: var(--font-text); font-size: 11px; font-weight: 600;
    padding: 4px 9px; border-radius: 4px; line-height: 1.4;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .chip.date { background: var(--ochre-400); color: var(--cream-50); }
  .chip.places { background: transparent; color: var(--clay-500); border: 1px solid rgba(43,31,24,0.14); }
  .chip.full { background: var(--clay-800); color: var(--cream-50); }
</style></head>
<body>
  <div class="label">Tags &amp; chips</div>
  <div class="row"><span class="lab">Tag pills</span>
    <span class="tag ochre">Séminaire</span>
    <span class="tag terra">Pratique</span>
    <span class="tag sand">Lecture</span>
    <span class="tag sage">Méditation</span>
    <span class="tag outline">Partenaire</span>
  </div>
  <div class="row"><span class="lab">Date chips</span>
    <span class="chip date">LUN 2 JUIN</span>
    <span class="chip places">12 places</span>
    <span class="chip full">Complet</span>
  </div>
</body></html>
