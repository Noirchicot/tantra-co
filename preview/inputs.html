<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay-500); margin-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-family: var(--font-text); font-size: 13px; color: var(--clay-500); font-weight: 500; }
  .field input, .field select, .field textarea {
    font-family: var(--font-text); font-size: 15px; color: var(--clay-800);
    background: var(--cream-50); padding: 11px 14px; border-radius: 8px;
    border: 1px solid rgba(43,31,24,0.14); outline: none;
    transition: border 160ms;
  }
  .field input:focus { border-color: var(--terracotta-400); }
  .field input::placeholder { color: var(--clay-300); }
  .field.error input { border-color: var(--terracotta-600); }
  .field.error .help { font-size: 12px; color: var(--terracotta-600); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
</style></head>
<body>
  <div class="label">Form fields</div>
  <div class="row">
    <div class="field">
      <label>Prénom</label>
      <input type="text" value="Marie">
    </div>
    <div class="field">
      <label>Adresse e-mail</label>
      <input type="email" placeholder="marie@example.com">
    </div>
    <div class="field" style="grid-column: 1 / -1;">
      <label>Message (facultatif)</label>
      <input type="text" placeholder="Une question, une intention…">
    </div>
    <div class="field error" style="grid-column: 1 / -1;">
      <label>Numéro de téléphone</label>
      <input type="text" value="abc">
      <span class="help">Format non reconnu — merci de vérifier.</span>
    </div>
  </div>
</body></html>
