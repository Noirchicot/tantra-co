<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay-500); margin-bottom: 14px; }
  .player {
    display: grid; grid-template-columns: 64px 1fr auto;
    gap: 18px; align-items: center;
    padding: 20px 22px; background: var(--sage-500); color: var(--cream-50);
    border-radius: 14px; max-width: 620px;
  }
  .play { width: 56px; height: 56px; border-radius: 999px; background: var(--cream-50); color: var(--sage-700); display:flex; align-items:center; justify-content:center; font-size: 22px; cursor: pointer; }
  .info .eyebrow { font-family: var(--font-text); font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; opacity: .75; }
  .info h3 { font-family: var(--font-display); font-style: italic; font-size: 20px; margin-top: 2px; line-height: 1.2; font-variation-settings:'opsz' 22; }
  .track { display: flex; flex-direction: column; gap: 6px; min-width: 220px; }
  .bar { width: 100%; height: 3px; background: rgba(250,245,235,0.25); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; width: 32%; height: 100%; background: var(--cream-50); }
  .time { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; opacity: .75; }
</style></head>
<body>
  <div class="label">Meditation player · sage surface</div>
  <div class="player">
    <div class="play">▶</div>
    <div class="info">
      <div class="eyebrow">Méditation guidée</div>
      <h3>Présence à l'arrivée — 12 min</h3>
    </div>
    <div class="track">
      <div class="bar"><i></i></div>
      <div class="time"><span>3:48</span><span>12:00</span></div>
    </div>
  </div>
</body></html>
