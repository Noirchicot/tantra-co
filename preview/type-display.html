<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 4px; }
  .name { font-size: 11px; font-weight: 600; color: var(--clay-500); letter-spacing: 0.12em; text-transform: uppercase; }
  .meta { font-size: 11px; color: var(--clay-300); font-family: var(--font-mono); }
  .specimen { font-family: var(--font-display); color: var(--clay-800); font-style: italic; font-weight: 400; line-height: 1; letter-spacing: -0.01em; }
</style></head>
<body>
  <div class="row"><span class="name">Display · Newsreader Italic</span><span class="meta">opsz variable · 300–700</span></div>
  <div class="specimen" style="font-size: 88px; font-variation-settings:'opsz' 72;">Tantra &amp; Co.</div>
  <div style="margin-top:14px; font-family: var(--font-display); font-style: italic; font-size: 32px; color: var(--clay-700); font-variation-settings:'opsz' 28;">Une soirée mensuelle pour découvrir le Tantra</div>
</body></html>
