<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .name { font-size: 11px; font-weight: 600; color: var(--clay-500); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
  .specimen { font-family: var(--font-text); color: var(--clay-800); line-height: 1; font-weight: 400; }
  .weights { display: flex; gap: 24px; align-items: baseline; margin-top: 14px; font-family: var(--font-text); }
  .weights span { font-size: 22px; color: var(--clay-700); }
  .weights small { display:block; font-size: 10px; color: var(--clay-300); margin-top: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
  .sample { margin-top: 16px; font-family: var(--font-text); font-size: 15px; line-height: 1.55; color: var(--clay-700); max-width: 580px; }
</style></head>
<body>
  <div class="name">Text · Manrope</div>
  <div class="specimen" style="font-size:72px; font-weight:400; letter-spacing:-0.02em;">Manrope</div>
  <div class="weights">
    <div><span style="font-weight:300">Aa</span><small>300 Light</small></div>
    <div><span style="font-weight:400">Aa</span><small>400 Regular</small></div>
    <div><span style="font-weight:500">Aa</span><small>500 Medium</small></div>
    <div><span style="font-weight:600">Aa</span><small>600 Semibold</small></div>
    <div><span style="font-weight:700">Aa</span><small>700 Bold</small></div>
  </div>
  <div class="sample">Deux heures, le premier lundi de chaque mois. De la pratique, des échanges, et du temps pour accueillir ce qui se présente.</div>
</body></html>
