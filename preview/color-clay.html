<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--clay-500); margin-bottom: 16px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1 / 0.95; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--font-text); }
  .sw .name { font-weight: 600; font-size: 12px; }
  .sw .hex { font-size: 11px; opacity: .8; }
</style></head>
<body>
  <div class="label">Clay · text neutrals</div>
  <div class="row">
    <div class="sw" style="background:#877264; color:#FAF5EB"><span class="name">clay-300</span><span class="hex">877264 · meta</span></div>
    <div class="sw" style="background:#5B463A; color:#FAF5EB"><span class="name">clay-500</span><span class="hex">5B463A · secondary</span></div>
    <div class="sw" style="background:#3A2A22; color:#FAF5EB"><span class="name">clay-700</span><span class="hex">3A2A22</span></div>
    <div class="sw" style="background:#2B1F18; color:#FAF5EB"><span class="name">clay-800</span><span class="hex">2B1F18 · body</span></div>
    <div class="sw" style="background:#1A120E; color:#FAF5EB"><span class="name">clay-900</span><span class="hex">1A120E</span></div>
  </div>
</body></html>
