<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--clay-500); margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .sw { aspect-ratio: 1 / 1.1; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; font-size: 10px; font-family: var(--font-text); }
  .sw .n { font-weight: 600; }
  .sw .h { opacity: .7; }
</style></head>
<body>
  <div class="label">Ochre · highlight</div>
  <div class="row">
    <div class="sw" style="background:#FAF1DD; color:#5E4012"><span class="n">50</span><span class="h">FAF1DD</span></div>
    <div class="sw" style="background:#F1DFB4; color:#5E4012"><span class="n">100</span><span class="h">F1DFB4</span></div>
    <div class="sw" style="background:#E5C580; color:#5E4012"><span class="n">200</span><span class="h">E5C580</span></div>
    <div class="sw" style="background:#D6A858; color:#3B1A11"><span class="n">300</span><span class="h">D6A858</span></div>
    <div class="sw" style="background:#C68B3D; color:#FAF5EB"><span class="n">400</span><span class="h">C68B3D</span></div>
    <div class="sw" style="background:#A87326; color:#FAF5EB"><span class="n">500</span><span class="h">A87326</span></div>
    <div class="sw" style="background:#5E4012; color:#FAF5EB"><span class="n">700</span><span class="h">5E4012</span></div>
  </div>
</body></html>
