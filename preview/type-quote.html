<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 32px 40px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--terracotta-600); margin-bottom: 18px; }
  .quote { font-family: var(--font-display); font-style: italic; font-size: 30px; line-height: 1.3; color: var(--clay-700); font-weight: 400; max-width: 600px; text-wrap: balance; font-variation-settings: 'opsz' 36; }
  .attr { margin-top: 14px; font-family: var(--font-text); font-size: 13px; letter-spacing: 0.04em; color: var(--clay-500); }
  .attr::before { content: "— "; }
</style></head>
<body>
  <div class="eyebrow">Pull quote · editorial</div>
  <div class="quote">« La pratique n'est pas une performance. C'est une manière d'écouter ce qui est déjà là. »</div>
  <div class="attr">extrait, séminaire de mai</div>
</body></html>
