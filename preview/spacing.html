<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay-500); margin-bottom: 18px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 4px 0; font-family: var(--font-text); font-size: 12px; color: var(--clay-500); }
  .row .n { width: 32px; font-weight: 600; color: var(--clay-700); font-family: var(--font-mono); }
  .row .px { width: 56px; color: var(--clay-300); font-family: var(--font-mono); }
  .bar { height: 8px; background: var(--terracotta-500); border-radius: 2px; }
</style></head>
<body>
  <div class="label">Spacing scale · 4-base</div>
  <div class="row"><span class="n">1</span><span class="px">4 px</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="n">2</span><span class="px">8 px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="n">3</span><span class="px">12 px</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="n">4</span><span class="px">16 px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="n">5</span><span class="px">24 px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="n">6</span><span class="px">32 px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="n">7</span><span class="px">48 px</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="n">8</span><span class="px">64 px</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="n">9</span><span class="px">96 px</span><div class="bar" style="width:96px"></div></div>
  <div class="row"><span class="n">10</span><span class="px">128 px</span><div class="bar" style="width:128px"></div></div>
</body></html>
