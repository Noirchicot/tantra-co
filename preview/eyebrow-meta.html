<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay-500); margin-bottom: 20px; }
  .stack { display: flex; flex-direction: column; gap: 28px; }
  .demo .eb { font-family: var(--font-text); font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--terracotta-600); }
  .demo h2 { font-family: var(--font-display); font-size: 36px; line-height: 1.15; color: var(--clay-800); margin-top: 8px; font-variation-settings:'opsz' 36; }
  .meta-line { font-family: var(--font-text); font-size: 13px; color: var(--clay-500); display: flex; gap: 10px; align-items: center; }
  .meta-line .dot { color: var(--clay-300); }
</style></head>
<body>
  <div class="label">Eyebrow + meta line</div>
  <div class="stack">
    <div class="demo">
      <div class="eb">Prochain séminaire</div>
      <h2>Une soirée pour découvrir le Tantra</h2>
    </div>
    <div class="meta-line">
      <span>Lun. 2 juin</span><span class="dot">·</span><span>19h30</span><span class="dot">·</span><span>Lausanne</span><span class="dot">·</span><span>12 places</span>
    </div>
  </div>
</body></html>
