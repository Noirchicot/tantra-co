<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--clay-500); margin-bottom: 16px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1 / 0.9; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--font-text); }
  .sw .name { font-weight: 600; font-size: 12px; }
  .sw .hex { font-size: 11px; opacity: .8; }
  .note { margin-top: 12px; font-size: 12px; color: var(--fg-2); font-style: italic; }
</style></head>
<body>
  <div class="label">Sage · restful, meditation-only</div>
  <div class="row">
    <div class="sw" style="background:#DDE3D2; color:#4E5B45"><span class="name">sage-100</span><span class="hex">DDE3D2</span></div>
    <div class="sw" style="background:#A8B595; color:#4E5B45"><span class="name">sage-300</span><span class="hex">A8B595</span></div>
    <div class="sw" style="background:#7A8A6D; color:#FAF5EB"><span class="name">sage-500</span><span class="hex">7A8A6D</span></div>
    <div class="sw" style="background:#4E5B45; color:#FAF5EB"><span class="name">sage-700</span><span class="hex">4E5B45</span></div>
  </div>
  <div class="note">Reserved for the meditation player and library category — gives that surface a different temperature.</div>
</body></html>
