<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay-500); margin-bottom: 18px; }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 72px; height: 72px; background: var(--cream-100); border: 1px solid rgba(43,31,24,0.12); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--clay-500); }
</style></head>
<body>
  <div class="label">Radii · corners stay restrained</div>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:2px"></div><div class="name">xs · 2</div></div>
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">sm · 4</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">md · 8</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="name">lg · 14</div></div>
    <div class="item"><div class="box" style="border-radius:24px"></div><div class="name">xl · 24</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="name">pill</div></div>
  </div>
</body></html>
