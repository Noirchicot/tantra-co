<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay-500); margin-bottom: 24px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .item { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .box { width: 100%; height: 96px; background: var(--cream-100); border-radius: 12px; border: 1px solid rgba(43,31,24,0.06); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--clay-500); }
  .desc { font-size: 11px; color: var(--clay-300); font-family: var(--font-text); font-style: italic; }
</style></head>
<body>
  <div class="label">Shadows · warm, used sparingly</div>
  <div class="row">
    <div class="item">
      <div class="box" style="box-shadow: 0 1px 2px rgba(43,31,24,0.06), 0 1px 1px rgba(43,31,24,0.04)"></div>
      <div class="name">shadow-1</div>
      <div class="desc">resting card</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 4px 12px rgba(43,31,24,0.08), 0 1px 2px rgba(43,31,24,0.05)"></div>
      <div class="name">shadow-2</div>
      <div class="desc">hover</div>
    </div>
    <div class="item">
      <div class="box" style="box-shadow: 0 14px 32px rgba(43,31,24,0.12), 0 2px 6px rgba(43,31,24,0.06)"></div>
      <div class="name">shadow-3</div>
      <div class="desc">modal / overlay</div>
    </div>
  </div>
</body></html>
