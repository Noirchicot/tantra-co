<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .label { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--clay-500); margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
  .sw { aspect-ratio: 1 / 1.1; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--font-text); font-size: 10px; }
  .sw .n { font-weight: 600; }
  .sw .h { opacity: .7; letter-spacing: 0.02em; }
</style></head>
<body>
  <div class="label">Terracotta · primary</div>
  <div class="row">
    <div class="sw" style="background:#FBEFE7; color:#7E3725"><span class="n">50</span><span class="h">FBEFE7</span></div>
    <div class="sw" style="background:#F2D6C4; color:#7E3725"><span class="n">100</span><span class="h">F2D6C4</span></div>
    <div class="sw" style="background:#E6B59A; color:#5C281A"><span class="n">200</span><span class="h">E6B59A</span></div>
    <div class="sw" style="background:#D69372; color:#3B1A11"><span class="n">300</span><span class="h">D69372</span></div>
    <div class="sw" style="background:#C57353; color:#FAF5EB"><span class="n">400</span><span class="h">C57353</span></div>
    <div class="sw" style="background:#B5563A; color:#FAF5EB"><span class="n">500</span><span class="h">B5563A</span></div>
    <div class="sw" style="background:#9B4730; color:#FAF5EB"><span class="n">600</span><span class="h">9B4730</span></div>
    <div class="sw" style="background:#7E3725; color:#FAF5EB"><span class="n">700</span><span class="h">7E3725</span></div>
    <div class="sw" style="background:#3B1A11; color:#FAF5EB"><span class="n">900</span><span class="h">3B1A11</span></div>
  </div>
</body></html>
